name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install

      - name: Generate bindings
        working-directory: src
        run: wails3 generate bindings -clean=true -ts

      - name: Build
        working-directory: src
        run: wails3 build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Stage artifact and checksum
        run: |
          Copy-Item src/bin/potato-chat.exe PotatoChat.exe
          $hash = (Get-FileHash PotatoChat.exe -Algorithm SHA256).Hash
          "$hash  PotatoChat.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Write-Output "sha256: $hash"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PotatoChat.exe
            SHA256SUMS.txt
          generate_release_notes: true
